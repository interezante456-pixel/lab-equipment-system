services:
  postgres:
    image: postgres:16-alpine
    container_name: lab_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-lab_system_db}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lab_system_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lab_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab_backend_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-lab_system_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_lab_jwt_key_2026_university_secure}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab_frontend_web
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - lab_network

  adminer:
    image: adminer:latest
    container_name: lab_adminer_ui
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - lab_network

volumes:
  pg_data:

networks:
  lab_network:
    driver: bridge
